<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<title>Skin-Biosense</title>
<style>
  :root{
    --bg:#10161a;
    --panel:#182126;
    --panel-2:#1f2b31;
    --line:#2b3a42;
    --ink:#e6eef1;
    --ink-dim:#8fa3ad;
    --trace:#7be38c;
    --primary:#3f8fd6;
    --warn:#e8a33d;
    --bad:#e2685f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink)}
  body{
    font:400 16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom));
    max-width:900px;margin:0 auto;
  }
  .mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}

  header{display:flex;align-items:baseline;gap:10px;padding:14px 0 10px;flex-wrap:wrap}
  header h1{font-size:20px;font-weight:600;margin:0;letter-spacing:.2px}
  header .ver{color:var(--ink-dim);font-size:13px}

  .status{
    display:flex;align-items:center;gap:10px;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:11px 14px;margin-bottom:12px;font-size:15px;
  }
  .dot{width:10px;height:10px;border-radius:50%;background:var(--bad);flex:none;transition:background .2s}
  .dot.on{background:var(--trace)}
  .dot.busy{background:var(--warn)}
  #statusText{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .sample{margin-bottom:12px}
  .sample input{font-size:17px;min-height:52px}

  .plotwrap{position:relative;background:#0b1114;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  canvas{display:block;width:100%;height:340px}
  .plotmeta{position:absolute;top:8px;right:12px;font-size:12px;color:var(--ink-dim);text-align:right;pointer-events:none}

  .row{display:flex;gap:10px;margin:12px 0}
  button{
    flex:1;min-height:56px;border:1px solid var(--line);border-radius:10px;
    background:var(--panel-2);color:var(--ink);font-size:17px;font-weight:600;
    font-family:inherit;cursor:pointer;
  }
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.38}
  button:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
  button.primary{background:var(--primary);border-color:var(--primary);color:#06121c}
  button.go{background:var(--trace);border-color:var(--trace);color:#08180d}
  button.off{color:var(--warn)}
  button.small{min-height:44px;font-size:15px;font-weight:500}

  details{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin:12px 0}
  summary{padding:14px;font-size:16px;font-weight:600;cursor:pointer;list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::after{content:"+";float:right;color:var(--ink-dim);font-weight:400}
  details[open] summary::after{content:"–"}
  .body{padding:0 14px 14px}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  label{display:block;font-size:13px;color:var(--ink-dim);margin-bottom:5px}
  input,select{
    width:100%;min-height:46px;padding:0 12px;background:#0d1417;color:var(--ink);
    border:1px solid var(--line);border-radius:8px;font:inherit;
    font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums;
  }
  input:focus,select:focus{outline:2px solid var(--primary);outline-offset:0}
  select{font-family:inherit}
  input::placeholder{color:#5d717b;font-family:-apple-system,system-ui,sans-serif}

  #log{
    height:170px;overflow:auto;background:#0b1114;border:1px solid var(--line);
    border-radius:8px;padding:10px;font-size:12px;line-height:1.5;
    font-family:ui-monospace,"SF Mono",Menlo,monospace;white-space:pre-wrap;word-break:break-all;
  }
  #log .tx{color:var(--primary)}
  #log .rx{color:var(--ink-dim)}
  #log .err{color:var(--bad)}
  #log .ok{color:var(--trace)}

  .note{font-size:13px;color:var(--ink-dim);margin:10px 0 0}
  .cb{display:flex;gap:10px;align-items:center;margin-top:14px;font-size:15px;color:var(--ink)}
  .cb input{width:24px;height:24px;min-height:0;flex:none}
  .path{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px;color:var(--ink-dim);
        word-break:break-all;margin-top:10px;line-height:1.6}

  dialog{
    border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);
    padding:20px;max-width:480px;width:calc(100% - 32px);
  }
  dialog::backdrop{background:rgba(0,0,0,.65)}
  dialog h2{margin:0 0 14px;font-size:18px}
</style>
</head>
<body>

<header>
  <h1>Skin-Biosense</h1>
  <span class="ver mono">version 4.0.0</span>
</header>

<div class="status">
  <span class="dot" id="dot"></span>
  <span id="statusText">Not connected</span>
</div>

<div class="sample">
  <label for="sampleName">Sample name</label>
  <input id="sampleName" type="text" placeholder="Type the sample name before starting" autocapitalize="none" spellcheck="false">
</div>

<div class="plotwrap">
  <canvas id="plot"></canvas>
  <div class="plotmeta mono" id="plotmeta"></div>
</div>

<div class="row">
  <button id="btnConnect" class="primary">Connect</button>
  <button id="btnInit" disabled>Initialize</button>
</div>
<div class="row">
  <button id="btnStart" class="go" disabled>Start</button>
  <button id="btnOff" class="off" disabled>Switch off</button>
</div>
<div class="row">
  <button id="btnExport" class="small" disabled>Export</button>
  <button id="btnClear" class="small" disabled>Erase graph</button>
</div>

<details>
  <summary>Measurement parameters</summary>
  <div class="body">
    <div class="grid">
      <div><label for="V_start">Start (V)</label><input id="V_start" type="text" inputmode="decimal" value="-0.4"></div>
      <div><label for="V_end">End (V)</label><input id="V_end" type="text" inputmode="decimal" value="2"></div>
      <div><label for="freq">Frequency (Hz)</label><input id="freq" type="text" inputmode="decimal" value="25"></div>
      <div><label for="V_step">Step (mV)</label><input id="V_step" type="text" inputmode="decimal" value="5"></div>
      <div><label for="V_amp">Amplitude (mV)</label><input id="V_amp" type="text" inputmode="decimal" value="25"></div>
      <div><label for="t_wait">Wait time (ms)</label><input id="t_wait" type="text" inputmode="numeric" value="2000"></div>
      <div>
        <label for="GAIN">Gain</label>
        <select id="GAIN">
          <option value="1">1 — ±1000 µA</option>
          <option value="2" selected>2 — ±100 µA</option>
          <option value="3">3 — ±10 µA</option>
          <option value="4">4 — ±1 µA</option>
          <option value="6">6 — auto</option>
        </select>
      </div>
      <div><label for="ShutDownTime">Auto-off (s)</label><input id="ShutDownTime" type="text" inputmode="numeric" value="120"></div>
    </div>
  </div>
</details>

<details>
  <summary>Google Drive</summary>
  <div class="body">
    <div id="odStatus" class="note" style="margin-top:0"></div>
    <div class="row"><button class="small" id="btnOd">Test connection</button></div>
    <div class="path" id="odPath"></div>
    <p class="note">Files are written to the Drive of capteur.skinbiosense@gmail.com. No sign-in is needed on this device.</p>
  </div>
</details>

<details>
  <summary>BLE log</summary>
  <div class="body">
    <div id="log" class="mono"></div>
    <div class="row"><button class="small" id="btnClearLog">Clear log</button></div>
  </div>
</details>

<dialog id="dlgSave">
  <h2>Save measurement</h2>
  <label for="fname">File name</label>
  <input id="fname" type="text" value="mesure" autocapitalize="none" spellcheck="false">
  <div class="path" id="savePath"></div>
  <label class="cb"><input type="checkbox" id="localCopy"><span>Also keep a local copy on this device</span></label>
  <div class="row">
    <button class="small" id="btnCancelSave">Cancel</button>
    <button class="small" id="btnShare">Share</button>
    <button class="small primary" id="btnDoSave">Save</button>
  </div>
</dialog>

<script>
"use strict";
/* ============================================================================
   Skin-Biosense v4.0.0
   Port of the techBASIC "SUWED" program (Fluika OÜ) to Web Bluetooth.
   Runs in any browser exposing navigator.bluetooth — Bluefy / WebBLE on iPadOS,
   Chrome / Edge on Android. Deviations from the .bas are marked [DIFF].
   ========================================================================== */

/* --- Nordic UART service, as in the .bas (lowercase UUIDs) ---------------- */
const NUS_SERVICE = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const NUS_WRITE   = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
const NUS_NOTIFY  = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';

/* --- Fixed protocol constants (no longer exposed in the UI) --------------- */
const TRANSMISSION_MODE = 1;        // 1 = stream during the measurement
const PARAM_LEADING_SPACE = false;  // set true if the firmware expects "A( 42093)"
const INT_MODE = 'round';           // 'round' | 'trunc' — see release notes
const NR_DATA_POINTS = 1510;

/* --- Google Drive endpoint (Apps Script web app) -------------------------- */
/* Deploy Code.gs on capteur.skinbiosense@gmail.com, then paste the /exec URL
   and the shared token below. Both must match the script. */
const GAS_URL   = 'https://script.google.com/macros/s/AKfycbym-Od-9xm1BHqahleR0SwcWsStXQkQyxZZd_ClvpQDqQjSjehPDRLDPYPEg74b-2ni/exec';               // <<< https://script.google.com/macros/s/AKfy.../exec
const GAS_TOKEN = 'efzetf478sdrztg45erg2e1tg5-y7bft874h8thbed';               // <<< same string as TOKEN in Code.gs
const DRIVE_ROOT = 'SUWED v4';

/* --- Calibration (default values from the .bas, overwritten by Initialize) - */
const cal = {
  pot_a: -80.7662e-6,
  pot_b: 2.99969,
  ADC_a: [3.915487e-2, 4.014471e-3, 4.026303e-4, 3.861204e-5],
  ADC_b: [-1.166343e3, -1.195791e2, -1.199943e1, -1.140467],
  DAC_a: null, DAC_b: null
};

let cfg = {}, der = {};
let dev = null, gatt = null, chWrite = null, chNotify = null;
let devName = '';
let comMODE = 0;
let userDisconnect = false;
const cs = { names:[], params:[], ri:0, run:0, wait:0 };
let regs = [], regsi = 0;
let pts = [], lastIndex = -1;
let watchdog = null, retries = 0;
let measuredSample = '';

/* --- Helpers -------------------------------------------------------------- */
const $ = id => document.getElementById(id);
const num = (id, d) => { const v = parseFloat($(id).value.replace(',', '.')); return Number.isFinite(v) ? v : d; };
const toInt = x => INT_MODE === 'trunc' ? Math.trunc(x) : Math.round(x);

function log(msg, cls) {
  const el = $('log'), t = new Date().toISOString().substr(11, 8);
  const s = document.createElement('span');
  s.className = cls || ''; s.textContent = t + '  ' + msg + '\n';
  el.appendChild(s);
  while (el.childNodes.length > 400) el.removeChild(el.firstChild);
  el.scrollTop = el.scrollHeight;
}
function setStatus(text, state) {
  $('statusText').textContent = text;
  $('dot').className = 'dot' + (state ? ' ' + state : '');
}
function sanitize(s) {
  return (s || '').trim().replace(/[\\/:*?"<>|#%]/g, '-').replace(/\s+/g, '_').slice(0, 80);
}
function today() { return new Date().toLocaleDateString('sv-SE'); }  // YYYY-MM-DD, local time

/* --- Parameters and derived registers (head of the .bas) ------------------ */
function readConfig() {
  cfg = {
    V_start: num('V_start', -0.4),
    V_end:   num('V_end', 2),
    freq:    num('freq', 25),
    V_step:  num('V_step', 5),
    V_amp:   num('V_amp', 25),
    t_wait:  Math.round(num('t_wait', 2000)),
    GAIN:    parseInt($('GAIN').value, 10),
    ShutDownTime: Math.round(num('ShutDownTime', 120))
  };
  computeDerived();
}
function computeDerived() {
  const a = cal.pot_a, b = cal.pot_b, d = {};
  d.D_start = toInt((cfg.V_start - b) / a);
  d.D_T     = toInt(500.0 / cfg.freq);
  d.D_step  = toInt(cfg.V_step / (1000 * Math.abs(a)));
  d.D_amp   = toInt(cfg.V_amp / (1000 * Math.abs(a)));
  d.N_Steps = 0;
  if (cfg.V_step > 0) {
    d.N_Steps = toInt(2000 * Math.abs(cfg.V_start - cfg.V_end) / cfg.V_step);
    if (d.N_Steps > 1500) { d.N_Steps = 1500; log('Too many points, capped at 1500', 'err'); }
  }
  der = d;
}

/* --- BLE connection ------------------------------------------------------- */
async function connect() {
  if (!navigator.bluetooth) {
    setStatus('Web Bluetooth unavailable in this browser', 'busy');
    log('navigator.bluetooth missing. On iPad use Bluefy or WebBLE; on Android use Chrome.', 'err');
    return;
  }
  try {
    setStatus('Looking for a device…', 'busy');
    dev = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: 'SUWED' }],
      optionalServices: [NUS_SERVICE]
    });
    devName = dev.name || 'SUWED';
    dev.addEventListener('gattserverdisconnected', onDisconnected);
    await openGatt();
  } catch (e) {
    setStatus('Connection cancelled or failed');
    log('requestDevice: ' + e.message, 'err');
  }
}
async function openGatt() {
  setStatus('Connecting to ' + devName + '…', 'busy');
  gatt = await dev.gatt.connect();
  const svc = await gatt.getPrimaryService(NUS_SERVICE);
  chWrite  = await svc.getCharacteristic(NUS_WRITE);
  chNotify = await svc.getCharacteristic(NUS_NOTIFY);
  chNotify.addEventListener('characteristicvaluechanged', onNotify);
  await chNotify.startNotifications();
  log('Connected to ' + devName, 'ok');
  setStatus(devName + ' connected', 'on');
  enable(true); renderOd();
}
function onDisconnected() {
  enable(false); clearWatchdog(); cs.run = 0;
  if (userDisconnect) { userDisconnect = false; setStatus('Disconnected'); return; }
  setStatus('Connection lost — reconnecting…', 'busy');
  log('Connection lost', 'err');
  setTimeout(() => {
    if (!dev) return;
    openGatt().catch(e => { setStatus('Reconnection failed'); log('Reconnect: ' + e.message, 'err'); });
  }, 1500);
}
function enable(on) {
  ['btnInit', 'btnStart', 'btnOff'].forEach(id => $(id).disabled = !on);
  $('btnConnect').textContent = on ? 'Disconnect' : 'Connect';
}

/* --- Command transmission (sendToUWED) ------------------------------------ */
function fmtParam(p) {
  const s = String(Math.trunc(p));
  return (PARAM_LEADING_SPACE && p >= 0) ? ' ' + s : s;
}
async function sendToUWED(str) {
  if (!chWrite) return;
  const b = new Uint8Array(str.length);
  for (let i = 0; i < str.length; i++) b[i] = str.charCodeAt(i) & 0xff;
  try {
    if (chWrite.writeValueWithResponse) await chWrite.writeValueWithResponse(b);
    else await chWrite.writeValue(b);
    log('TX ' + str, 'tx');
  } catch (e) { log('TX failed ' + str + ': ' + e.message, 'err'); }
}

/* --- Command stack (CS_*) ------------------------------------------------- */
function csReset() { cs.names = []; cs.params = []; cs.ri = 0; cs.run = 0; cs.wait = 0; }
function csAdd(n, p) { cs.names.push(n); cs.params.push(p); }
function csSendPending() {
  const n = cs.names[cs.ri];
  sendToUWED(n + '(' + fmtParam(cs.params[cs.ri]) + ')');
  armWatchdog(n);
}
function csStart() {
  if (!cs.names.length) return;
  cs.ri = 0; cs.run = 1; cs.wait = 0;
  pts = []; lastIndex = -1;
  csSendPending();
}
/* [DIFF] The .bas only resends after 5 mismatching frames, so never on total
   silence. Time-based watchdog added, disabled during "M". */
function armWatchdog(name) {
  clearWatchdog();
  if (name === 'M') return;
  watchdog = setTimeout(() => {
    if (!cs.run) return;
    if (retries++ < 5) { log('No reply, resending', 'err'); csSendPending(); }
    else { cs.run = 0; setStatus('No reply from device'); log('Giving up after 5 attempts', 'err'); }
  }, 2500);
}
function clearWatchdog() { if (watchdog) { clearTimeout(watchdog); watchdog = null; } retries = 0; }

function onNotify(ev) {
  const dv = ev.target.value;
  csProc(new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength));
}
function csProc(a) {
  if (a.length < 2 || !cs.run) return;
  const comType = a[1], expected = cs.names[cs.ri];
  if (expected === undefined) return;

  if (expected.charCodeAt(0) === comType - 32) {
    clearWatchdog(); cs.ri++; cs.wait = 0;
    log('RX ack ' + String.fromCharCode(comType), 'rx');
    if (comType === 0x74) parseRegister(a);           // 't'
    if (cs.ri < cs.names.length) csSendPending();
    else { cs.run = 0; csDone(); }
    return;
  }
  if (expected === 'M') {
    if (comType === 0x4d) procData(a);                // 'M' data frame
    else if (comType === 0x71) {                      // 'q' scan complete
      clearWatchdog(); cs.ri++; cs.wait = 0;
      if (cs.ri < cs.names.length) csSendPending();
      else { cs.run = 0; csDone(); }
    }
    return;
  }
  cs.wait++;
  if (cs.wait > 5) { csSendPending(); cs.wait = 0; }
}
function csDone() {
  clearWatchdog();
  if (comMODE === 1) {
    setStatus('Measurement complete — ' + pairCount() + ' points', 'on');
    log('Measurement sequence complete', 'ok');
    openSave();
  } else {
    applyRegisters();
    setStatus(devName + ' — calibration loaded, ready', 'on');
    log('Calibration loaded', 'ok');
  }
  refreshButtons();
}

/* --- Registers (T / t) ---------------------------------------------------- */
function parseRegister(a) {
  let s = '';
  for (let i = 3; i <= 19 && i < a.length; i++) if (a[i] !== 0x20) s += String.fromCharCode(a[i]);
  regsi++;
  if (regsi <= 20) regs[regsi - 1] = s;
}
function applyRegisters() {
  const v = i => parseFloat(regs[i]) || 0;
  cal.DAC_a = v(4) / (-1e11);
  cal.DAC_b = v(5) / 1e6;
  cal.ADC_a[0] = v(6)  / 1e8;  cal.ADC_b[0] = v(7)  / 1e3;
  cal.ADC_a[1] = v(8)  / 1e9;  cal.ADC_b[1] = v(9)  / 1e4;
  cal.ADC_a[2] = v(10) / 1e10; cal.ADC_b[2] = v(11) / 1e5;
  cal.ADC_a[3] = v(12) / 1e11; cal.ADC_b[3] = v(13) / 1e6;
  /* [DIFF] As in the .bas, DAC_a/DAC_b are read but NOT applied to pot_a/pot_b. */
}

/* --- Sequences ------------------------------------------------------------ */
function initializeUWED() {
  readConfig();
  pts = []; lastIndex = -1;
  measuredSample = sanitize($('sampleName').value);
  comMODE = 1;
  csReset();
  csAdd('A', der.D_start);
  csAdd('X', 0);
  csAdd('S', 14);
  csAdd('U', cfg.ShutDownTime * 1000);
  csAdd('U', 1);
  csAdd('K', TRANSMISSION_MODE);
  csAdd('B', cfg.GAIN - 1);
  csAdd('E', der.D_T);
  csAdd('J', cfg.t_wait);
  if (cfg.V_end > cfg.V_start) {
    csAdd('G', -1 * (der.D_step + 2 * der.D_amp));
    csAdd('I', 2 * der.D_amp);
  } else {
    csAdd('G', der.D_step + 2 * der.D_amp);
    csAdd('I', -2 * der.D_amp);
  }
  csAdd('L', der.N_Steps);
  csAdd('M', 0);
  csStart();
  setStatus('Measuring…', 'busy');
  draw();
}
function readRegisters() {
  readConfig();
  comMODE = 0; regs = []; regsi = 0;
  csReset();
  csAdd('X', 0);
  csAdd('S', 14);
  csAdd('U', cfg.ShutDownTime * 1000);
  for (let i = 1; i <= 20; i++) csAdd('T', i - 1);
  csStart();
  setStatus('Reading registers…', 'busy');
}

/* --- Data decoding (procData) -------------------------------------------- */
function beVal(a, b, e) { let s = a[b]; for (let i = b + 1; i <= e; i++) s = s * 256 + a[i]; return s; }
function pushPoint(a, gi, tsA, tsB, vA, vB, aA, aB) {
  const G = a[gi], gIdx = Math.min(3, Math.max(0, G));
  const dVr = beVal(a, vA, vB), dADC = beVal(a, aA, aB);
  pts.push({
    G: G, Ts: beVal(a, tsA, tsB), dVr: dVr,
    Vr: dVr * cal.pot_a + cal.pot_b,
    dADC: dADC,
    IuA: cal.ADC_a[gIdx] * dADC + cal.ADC_b[gIdx]
  });
}
function procData(a) {
  if (a[0] === lastIndex) return;
  lastIndex = a[0];
  if (a[1] !== 0x4d || a.length < 16) return;
  if (pts.length + 2 > NR_DATA_POINTS) return;
  pushPoint(a, 2,  3,  4,  5,  6,   7,  8);
  pushPoint(a, 9, 10, 11, 12, 13, 14, 15);
  setStatus('Receiving data…', 'busy');
  draw(); refreshButtons();
}

/* --- SWV curve: (V1+V2)/2 vs I2-I1 --------------------------------------- */
function pairCount() { return Math.floor(pts.length / 2); }
function swvPairs() {
  const out = [];
  for (let k = 0; k < pairCount(); k++) {
    const p1 = pts[2 * k], p2 = pts[2 * k + 1];
    out.push([(p2.Vr + p1.Vr) / 2, p2.IuA - p1.IuA]);
  }
  return out;
}

/* --- Plot ----------------------------------------------------------------- */
const cv = $('plot'), ctx = cv.getContext('2d');

/* Round tick step: X spans exactly Start..End, gridlines on round values. */
function niceStep(range, maxTicks) {
  const cands = [0.01, 0.02, 0.025, 0.05, 0.1, 0.2, 0.25, 0.5, 1, 2, 2.5, 5, 10, 20, 50, 100, 200, 500, 1000];
  for (const s of cands) if (range / s <= maxTicks) return s;
  return cands[cands.length - 1];
}
function ticksIn(lo, hi, step) {
  const out = [];
  const first = Math.ceil(lo / step - 1e-9) * step;
  for (let v = first; v <= hi + 1e-9; v += step) out.push(Math.abs(v) < 1e-12 ? 0 : v);
  return out;
}
function fmtTick(v, step) {
  const dec = Math.max(0, -Math.floor(Math.log10(step)) + (String(step).indexOf('5') > 1 ? 1 : 0));
  return v.toFixed(Math.min(4, dec));
}

function sizeCanvas() {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(r.width * dpr);
  cv.height = Math.round(r.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}

function draw() {
  const dpr = window.devicePixelRatio || 1;
  const w = cv.width / dpr, h = cv.height / dpr;
  const m = { l: 64, r: 16, t: 16, b: 42 };
  ctx.clearRect(0, 0, w, h);

  const data = swvPairs();

  // X domain: exactly Start..End
  const x0 = Math.min(cfg.V_start, cfg.V_end), x1 = Math.max(cfg.V_start, cfg.V_end);
  // Y domain: dynamic autoscale on min/max
  let y0 = -100, y1 = 100;
  if (data.length > 1) {
    y0 = Math.min.apply(null, data.map(p => p[1]));
    y1 = Math.max.apply(null, data.map(p => p[1]));
    if (y1 - y0 < 1e-9) { y0 -= 1; y1 += 1; }
    const pad = (y1 - y0) * 0.08; y0 -= pad; y1 += pad;
  }
  const X = v => m.l + (v - x0) / (x1 - x0) * (w - m.l - m.r);
  const Y = v => h - m.b - (v - y0) / (y1 - y0) * (h - m.t - m.b);

  const xStep = niceStep(x1 - x0, Math.max(3, Math.floor((w - m.l - m.r) / 48)));
  const yStep = niceStep(y1 - y0, 6);

  ctx.strokeStyle = '#223037'; ctx.lineWidth = 1;
  ctx.fillStyle = '#8fa3ad'; ctx.font = '11px ui-monospace,Menlo,monospace';

  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (const yv of ticksIn(y0, y1, yStep)) {
    const py = Y(yv);
    ctx.beginPath(); ctx.moveTo(m.l, py); ctx.lineTo(w - m.r, py); ctx.stroke();
    ctx.fillText(fmtTick(yv, yStep), m.l - 8, py);
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (const xv of ticksIn(x0, x1, xStep)) {
    const px = X(xv);
    ctx.beginPath(); ctx.moveTo(px, m.t); ctx.lineTo(px, h - m.b); ctx.stroke();
    ctx.fillText(fmtTick(xv, xStep), px, h - m.b + 8);
  }
  // frame
  ctx.strokeStyle = '#33454e';
  ctx.strokeRect(m.l, m.t, w - m.l - m.r, h - m.t - m.b);

  ctx.fillStyle = '#8fa3ad'; ctx.font = '12px -apple-system,system-ui,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('Potential working vs ref (V)', (m.l + w - m.r) / 2, h - 8);
  ctx.save();
  ctx.translate(15, (m.t + h - m.b) / 2); ctx.rotate(-Math.PI / 2);
  ctx.textBaseline = 'top'; ctx.fillText('Current working electrode (µA)', 0, 0);
  ctx.restore();

  if (data.length > 1) {
    ctx.strokeStyle = '#7be38c'; ctx.lineWidth = 2; ctx.beginPath();
    data.forEach((p, i) => i ? ctx.lineTo(X(p[0]), Y(p[1])) : ctx.moveTo(X(p[0]), Y(p[1])));
    ctx.stroke();
  }
  const nm = $('sampleName').value.trim();
  $('plotmeta').textContent = nm || (data.length ? '' : 'Square wave voltammetry');
}

/* --- File content --------------------------------------------------------- */
function exportText() {
  return swvPairs().map(p => p[0] + ' ' + p[1]).join('\n') + '\n';
}

/* --- Google Drive via Apps Script ----------------------------------------- */
/* The request is a CORS "simple request" (text/plain body, no custom headers)
   so no preflight is issued. If the browser still blocks reading the reply,
   we retry with no-cors: the write goes through but cannot be confirmed. */
const drive = { get ready() { return !!(GAS_URL && GAS_TOKEN); } };

function driveFolder() {
  return DRIVE_ROOT + '/' + (devName || 'SUWED') + '/' + today() + '/raw';
}

async function driveUpload(fileName, text) {
  const payload = JSON.stringify({
    token: GAS_TOKEN,
    device: devName || 'SUWED',
    date: today(),
    sample: measuredSample || '',
    filename: fileName,
    points: pairCount(),
    content: text
  });
  try {
    const r = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: payload,
      redirect: 'follow'
    });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'script error');
    return { confirmed: true, path: j.path || driveFolder() + '/' + fileName };
  } catch (e) {
    // Opaque fallback: the POST is still delivered, the reply is unreadable.
    await fetch(GAS_URL, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: payload
    });
    log('Drive reply unreadable (' + e.message + ') — sent without confirmation', 'err');
    return { confirmed: false, path: driveFolder() + '/' + fileName };
  }
}

async function driveTest() {
  if (!drive.ready) return;
  const b = $('btnOd'); b.disabled = true; b.textContent = 'Testing…';
  try {
    const r = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ token: GAS_TOKEN, ping: true })
    });
    const j = await r.json();
    if (j.ok) { $('odStatus').textContent = 'Connected. Drive account: ' + (j.account || 'unknown'); log('Drive test OK', 'ok'); }
    else { $('odStatus').textContent = 'Script reachable but refused: ' + j.error; log('Drive test refused: ' + j.error, 'err'); }
  } catch (e) {
    $('odStatus').textContent = 'No readable reply. Writes may still work — run one real save to check the Drive folder.';
    log('Drive test failed: ' + e.message, 'err');
  }
  b.disabled = false; b.textContent = 'Test connection';
}

function renderOd() {
  $('odPath').textContent = driveFolder() + '/<file>.txt';
  const el = $('odStatus'), b = $('btnOd');
  if (!drive.ready) {
    el.textContent = 'Not configured. Set GAS_URL and GAS_TOKEN at the top of the source.';
    b.disabled = true;
  } else {
    el.textContent = 'Configured. Use Test connection to check the endpoint.';
    b.disabled = false;
  }
}

/* --- Save dialog ---------------------------------------------------------- */
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

function openSave() {
  const base = measuredSample || sanitize($('sampleName').value) || 'mesure';
  $('fname').value = base;
  $('savePath').textContent = drive.ready
    ? 'Google Drive → ' + driveFolder() + '/'
    : 'Local file only (Drive endpoint not configured)';
  $('localCopy').checked = true;
  $('dlgSave').showModal();
}

function anchorDownload(name, text) {
  const url = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));
  const a = document.createElement('a');
  a.href = url; a.download = name; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

/* Android / desktop: direct download into the Downloads folder — the share
   sheet there offers apps, not storage. iOS: share sheet → "Save to Files",
   because the download attribute is unreliable inside WKWebView. */
async function localSave(name, text) {
  if (!isIOS) { anchorDownload(name, text); return 'downloaded'; }
  const file = new File([text], name, { type: 'text/plain' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return 'shared'; }
    catch (e) { if (e.name === 'AbortError') return 'cancelled'; }
  }
  anchorDownload(name, text);
  return 'downloaded';
}

async function shareOut(name, text) {
  const file = new File([text], name, { type: 'text/plain' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); }
    catch (e) { if (e.name !== 'AbortError') log('Share failed: ' + e.message, 'err'); }
  } else { anchorDownload(name, text); }
}

function currentName() { return (sanitize($('fname').value) || 'mesure') + '.txt'; }

async function doSave() {
  const name = currentName(), text = exportText();
  const alsoLocal = $('localCopy').checked;
  $('btnDoSave').disabled = true;
  let cloud = null;
  if (drive.ready) {
    setStatus('Uploading to Drive…', 'busy');
    try { cloud = await driveUpload(name, text); log('Drive: ' + cloud.path +
      (cloud.confirmed ? '' : ' (unconfirmed)'), cloud.confirmed ? 'ok' : 'err'); }
    catch (e) { log('Drive upload failed: ' + e.message, 'err'); }
  }
  if (alsoLocal || !cloud) await localSave(name, text);
  $('btnDoSave').disabled = false;
  $('dlgSave').close();
  if (cloud && cloud.confirmed) setStatus('Saved to Drive — ' + name, 'on');
  else if (cloud) setStatus('Sent to Drive (unconfirmed) — ' + name, 'on');
  else setStatus('Saved locally — ' + name, 'on');
}

/* --- UI wiring ------------------------------------------------------------ */
function refreshButtons() {
  const has = pairCount() > 0;
  $('btnExport').disabled = !has;
  $('btnClear').disabled = !has;
}
$('btnConnect').onclick = async () => {
  if (gatt && gatt.connected) { userDisconnect = true; gatt.disconnect(); enable(false); return; }
  await connect();
};
$('btnInit').onclick   = () => { log('— Initialize: reading registers —'); readRegisters(); };
$('btnStart').onclick  = () => { log('— Starting measurement —'); initializeUWED(); refreshButtons(); };
$('btnOff').onclick    = () => { setStatus('Switching off', 'busy'); sendToUWED('Q()'); };
$('btnClear').onclick  = () => { pts = []; lastIndex = -1; draw(); refreshButtons(); };
$('btnExport').onclick = openSave;
$('btnClearLog').onclick = () => { $('log').textContent = ''; };
$('btnCancelSave').onclick = () => $('dlgSave').close();
$('btnDoSave').onclick = doSave;
$('btnShare').onclick = () => shareOut(currentName(), exportText());
$('btnOd').onclick = driveTest;
$('sampleName').addEventListener('input', draw);
['V_start','V_end','freq','V_step','V_amp','t_wait','GAIN','ShutDownTime']
  .forEach(id => $(id).addEventListener('change', () => { readConfig(); draw(); }));

window.addEventListener('resize', sizeCanvas);
readConfig();
sizeCanvas();
refreshButtons();
renderOd();
if (!navigator.bluetooth) {
  setStatus('Web Bluetooth unavailable — open in Bluefy', 'busy');
  log('navigator.bluetooth missing. Safari on iPadOS does not expose Web Bluetooth.', 'err');
}
</script>
